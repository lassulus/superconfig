<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TV</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: sans-serif;
        overflow: hidden;
      }
      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      video.standby {
        visibility: hidden;
      }
      video::cue {
        font-size: 5vh;
        line-height: 1.3;
        color: #fff;
        background: rgba(0, 0, 0, 0.75);
      }
      .screen {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2em;
        text-align: center;
      }
      #start {
        background: rgba(0, 0, 0, 0.6);
        cursor: pointer;
      }
      #info {
        position: absolute;
        left: 1.5em;
        bottom: 1.5em;
        max-width: 70%;
        padding: 0.6em 1em;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 0.4em;
        transition: opacity 1s;
      }
      #info.faded {
        opacity: 0;
      }
      #now {
        display: block;
        font-size: 1.3em;
        color: inherit;
        text-decoration: none;
      }
      #now[href]:hover {
        text-decoration: underline;
      }
      #next,
      #pending {
        opacity: 0.8;
        margin-top: 0.3em;
      }
      #controls {
        position: absolute;
        top: 1em;
        right: 1em;
        display: flex;
        gap: 0.4em;
        transition: opacity 1s;
      }
      #controls.faded {
        opacity: 0;
      }
      #controls button {
        font-size: 1.5em;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        border: 0;
        border-radius: 0.3em;
        cursor: pointer;
      }
      #queue {
        position: absolute;
        top: 4em;
        right: 1em;
        max-width: 70%;
        display: flex;
        flex-wrap: wrap;
        gap: 0.4em;
        padding: 0.6em;
        background: rgba(0, 0, 0, 0.7);
        border-radius: 0.4em;
      }
      #url {
        flex: 1;
        min-width: 18em;
        font-size: 1em;
      }
      #queued {
        width: 100%;
      }
      #debug {
        position: absolute;
        top: 1em;
        left: 1em;
        padding: 0.5em;
        background: rgba(0, 0, 0, 0.7);
        font: 14px monospace;
        white-space: pre;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <video id="a" playsinline preload="auto"></video>
    <video id="b" class="standby" playsinline preload="auto"></video>
    <div id="warmup" class="screen" hidden>Warming up…</div>
    <div id="info" class="faded">
      <a id="now" target="_blank" rel="noopener"></a>
      <div id="next"></div>
      <div id="pending"></div>
    </div>
    <div id="controls">
      <button id="cc" title="Subtitles" hidden>CC: off</button>
      <button id="add" title="Queue a video">+</button>
      <button id="fs" title="Fullscreen">⛶</button>
    </div>
    <form id="queue" hidden>
      <input id="url" placeholder="YouTube or Jellyfin URL" required />
      <button>Queue</button>
      <div id="queued"></div>
    </form>
    <div id="debug" hidden></div>
    <div id="start" class="screen">Tap to start</div>
    <script src="player.js"></script>
  </body>
</html>
