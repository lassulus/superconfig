[package]
name = "lazy-store"
version = "0.1.0"
edition = "2021"
description = "Lazy nix store FUSE file system for CI's machine builds"
publish = false

[dependencies]
# Kranzes' combined branch: kernel FUSE passthrough, async/io_uring and
# overlayfs fixes on top of cloud-hypervisor/fuse-backend-rs.
fuse-backend-rs = { git = "https://github.com/Kranzes/fuse-backend-rs", rev = "bac50ad4cf022b3428ac483cf14fd6f71817282f", features = ["fusedev"] }
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# rustls with bundled webpki roots: nothing read from /etc/ssl or the store
ureq = { version = "2", default-features = false, features = ["tls"] }
zstd = "0.13"
xz2 = { version = "0.1", features = ["static"] }
bzip2 = { version = "0.4", features = ["static"] }
flate2 = "1"
brotli-decompressor = "4"
harmonia-file-core = { git = "https://github.com/nix-community/harmonia", rev = "3edb37ae36b561c2d395980170c70bbce292bbc5" }
harmonia-utils-base-encoding = { git = "https://github.com/nix-community/harmonia", rev = "3edb37ae36b561c2d395980170c70bbce292bbc5" }

[profile.release]
debug = 1
