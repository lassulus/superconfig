[package]
name = "lazy-store"
version = "0.1.0"
edition = "2021"
description = "Lazy nix store FUSE file system for CI's machine builds"
publish = false

[dependencies]
# Kranzes' combined branch: kernel FUSE passthrough, async/io_uring and
# overlayfs fixes on top of cloud-hypervisor/fuse-backend-rs.
fuse-backend-rs = { git = "https://github.com/Kranzes/fuse-backend-rs", rev = "bac50ad4cf022b3428ac483cf14fd6f71817282f", features = ["fusedev"] }
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
futures-util = "0.3"
# rustls (aws-lc, as harmonia-utils-hash uses it anyway) with bundled roots:
# nothing read from /etc/ssl or the store
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream"] }
webpki-root-certs = "1"
async-compression = { version = "0.4", features = ["tokio", "zstd", "xz", "bzip2", "gzip", "brotli"] }
harmonia-file-core = { git = "https://github.com/nix-community/harmonia", rev = "3edb37ae36b561c2d395980170c70bbce292bbc5" }
harmonia-file-nar = { git = "https://github.com/nix-community/harmonia", rev = "3edb37ae36b561c2d395980170c70bbce292bbc5" }
harmonia-utils-hash = { git = "https://github.com/nix-community/harmonia", rev = "3edb37ae36b561c2d395980170c70bbce292bbc5" }

[profile.release]
debug = 1
