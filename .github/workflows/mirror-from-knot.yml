name: mirror-from-knot

# superconfig lives on tangled.org (knot.lassul.us/lass.pds.lassul.us/superconfig);
# GitHub is a read-only mirror. Every hour (and on demand) master is pulled
# from the knot over public HTTPS and pushed here, fast-forward only: a
# diverged GitHub master fails the run instead of being overwritten.
#
# Pushes with UPDATE_PKGS_TOKEN (fine-grained PAT, workflows write): the
# GITHUB_TOKEN may not push commits that touch .github/workflows, and a PAT
# push also starts CI (build all machines, fill cache.lassul.us) on its own.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-from-knot
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.UPDATE_PKGS_TOKEN }}
      - name: fast-forward master to the knot
        run: |
          git fetch https://knot.lassul.us/lass.pds.lassul.us/superconfig master
          new=$(git rev-parse FETCH_HEAD)
          old=$(git rev-parse HEAD)
          if [ "$new" = "$old" ]; then
            echo "up to date ($old)"
            exit 0
          fi
          git merge-base --is-ancestor "$old" "$new" || {
            echo "::error::GitHub master $old is not an ancestor of the knot's $new"
            exit 1
          }
          git push origin "$new:refs/heads/master"
