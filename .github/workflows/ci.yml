name: CI

# Builds master after every push (the mirror from the knot) and pushes the
# results to cache.lassul.us. tangled-prs.yml calls it for each new round of
# a tangled.org PR (inputs url/sha/pr): the PR commit is fetched into ./src
# (.github/fetch-pr.sh) and built, workflows and scripts stay master's,
# nothing is pushed to cache.lassul.us (CI_PUSH) and the ci job comments the
# result on the PR.
on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      pr:
        type: string
        default: ""
      sha:
        type: string
        default: ""
      url:
        description: git URL of the PR's source repo (knot + repo DID)
        type: string
        default: ""
    secrets:
      TANGLED_APP_PASSWORD:
        required: false

# A newer run for the same ref (or PR) replaces a running one.
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.pr }}
  cancel-in-progress: true

env:
  FLAKE: ${{ inputs.url && './src' || '.' }}
  CI_PUSH: ${{ !inputs.url }}
  NIX_CONFIG: |
    accept-flake-config = false

# One job per check shows failing checks in the run overview, the same for
# the NixOS machines, see the eval job.
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch all history for git-based operations
          fetch-depth: 0

      - if: inputs.url
        env:
          URL: ${{ inputs.url }}
          SHA: ${{ inputs.sha }}
        run: .github/fetch-pr.sh
      - uses: cachix/install-nix-action@v31

      - id: list
        run: |
          checks=$(nix eval --json "$FLAKE#checks.x86_64-linux" --apply builtins.attrNames)
          echo "checks=$checks" >> "$GITHUB_OUTPUT"

  check:
    needs: list
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.list.outputs.checks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch all history for git-based operations
          fetch-depth: 0

      - if: inputs.url
        env:
          URL: ${{ inputs.url }}
          SHA: ${{ inputs.sha }}
        run: .github/fetch-pr.sh
      - uses: cachix/install-nix-action@v31

      - env:
          CHECK: ${{ matrix.check }}
        run: nix build -L --no-link "$FLAKE#checks.x86_64-linux.$CHECK"

  outputs:
    name: packages and devShells
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch all history for git-based operations
          fetch-depth: 0

      - if: inputs.url
        env:
          URL: ${{ inputs.url }}
          SHA: ${{ inputs.sha }}
        run: .github/fetch-pr.sh
      - uses: cachix/install-nix-action@v31

      - run: |
          for output in packages devShells; do
            echo "$output:"
            # shellcheck disable=SC2016 # ${...} is Nix interpolation
            nix eval --raw "$FLAKE#$output.x86_64-linux" --apply 'xs: builtins.deepSeq (builtins.mapAttrs (_: x: x.drvPath) xs) "${toString (builtins.length (builtins.attrNames xs))} evaluated\n"'
          done

  # The NixOS machines, built on plain runners with hestia (the GitHub Actions
  # cache) as binary cache next to cache.lassul.us:
  #
  # - eval: evaluates ciToplevels once (iets), uploads the drv closures to hestia,
  #   lists the machines whose toplevel is in neither cache and the
  #   derivations needed by more than one of them (.github/ci-shared.sh).
  # - shared: builds those once, so the machine jobs substitute them instead
  #   of each building them; skipped when there are none.
  # - one job per listed machine, builds its toplevel by drv path on a lazy
  #   /nix/store (.github/lazy-store.sh): the paths it would substitute are
  #   only downloaded once a file in them is opened.
  #
  # Every job pushes what it added to the store to cache.lassul.us
  # (.github/ci-build.sh), for deploys.
  eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # hestia: detect evicted cache entries upfront
      id-token: write # niks3 push
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any-jobs: ${{ steps.matrix.outputs.any-jobs }}
      manifest-version: ${{ steps.matrix.outputs.manifest-version }}
      shared: ${{ steps.plan.outputs.shared }}
      niks3: ${{ steps.tools.outputs.niks3 }}
      lazy-store: ${{ steps.tools.outputs.lazy-store }}
    steps:
      - uses: actions/checkout@v4
      - if: inputs.url
        env:
          URL: ${{ inputs.url }}
          SHA: ${{ inputs.sha }}
        run: .github/fetch-pr.sh
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            trusted-users = root runner
            extra-substituters = https://cache.lassul.us
            extra-trusted-public-keys = cache.lassul.us-1:aOMEO5TU6eLvhyPi0jmgjR2sVlGjMq3rK0MeACjTcQ0=
      - uses: Mic92/hestia@v3
        with:
          upstream-cache-filter: true
          upstream-cache-key-names: cache.nixos.org-1 cache.lassul.us-1
          filter-drv-closures: true
      # the niks3 client of all jobs and the lazy store of the machine jobs,
      # the others substitute them; iets for the evaluation, its eval-jobs
      # is nix-eval-jobs about 5 times faster (no import from derivation)
      - id: tools
        run: |
          niks3=$(nix build --no-link --print-out-paths .#niks3)
          lazy=$(nix build --no-link --print-out-paths .#lazy-store)
          iets=$(nix build --no-link --print-out-paths .#iets)
          {
            echo "niks3=$niks3"
            echo "lazy-store=$lazy"
            echo "iets=$iets/bin/iets"
          } >> "$GITHUB_OUTPUT"
          PATH=$niks3/bin:$PATH .github/niks3-push.sh "$niks3" "$lazy" "$iets"
      - id: matrix
        uses: Mic92/hestia/matrix@v3
        with:
          flake: "${{ env.FLAKE }}#ciToplevels"
          nix-eval-jobs: "${{ steps.tools.outputs.iets }} eval-jobs --workers 4 --max-memory-size 3072"
      - env:
          MATRIX: ${{ steps.matrix.outputs.matrix }}
        run: |
          echo "not cached: $(jq -r '[.include[].name] | join(" ")' <<<"$MATRIX")" |
            tee -a "$GITHUB_STEP_SUMMARY"
      # the derivations the shared job builds and per machine the paths its
      # lazy store registers
      - id: plan
        if: steps.matrix.outputs.any-jobs == 'true'
        env:
          MATRIX: ${{ steps.matrix.outputs.matrix }}
        run: |
          matrix=$RUNNER_TEMP/matrix.json
          plans=$RUNNER_TEMP/plans
          printf '%s' "$MATRIX" > "$matrix"
          .github/ci-shared.sh "$matrix" "$plans"
          {
            for name in $(jq -r '.include[].name' "$matrix"); do
              echo "- $name: $(wc -l < "$plans/$name.drvs") derivations to build"
            done
            echo "- shared (needed by >= 2 machines): $(wc -l < "$plans/shared.drvs")"
            sed -E 's|^/nix/store/[^-]+-(.*)\.drv$|    \1|' "$plans/shared.drvs"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -s "$plans/shared.drvs" ]; then
            echo "shared=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.matrix.outputs.any-jobs == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plans
          path: |
            ${{ runner.temp }}/plans/shared.drvs
            ${{ runner.temp }}/plans/*.fetch

  shared:
    needs: eval
    if: needs.eval.outputs.shared == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # hestia: detect evicted cache entries upfront
      id-token: write # niks3 push
    outputs:
      manifest-version: ${{ steps.build.outputs.manifest-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            trusted-users = root runner
            extra-substituters = https://cache.lassul.us
            extra-trusted-public-keys = cache.lassul.us-1:aOMEO5TU6eLvhyPi0jmgjR2sVlGjMq3rK0MeACjTcQ0=
            # one build at a time, each on all cores: finished builds reach
            # the 5-minute upload sooner, and big builds (vector, radicle,
            # noctalia) don't share the runner's memory
            max-jobs = 1
      - uses: Mic92/hestia@v3
        with:
          upstream-cache-filter: true
          upstream-cache-key-names: cache.nixos.org-1 cache.lassul.us-1
          wait-manifest-version: ${{ needs.eval.outputs.manifest-version }}
      - env:
          NIKS3: ${{ needs.eval.outputs.niks3 }}
        run: |
          nix-store --realise "$NIKS3"
          echo "$NIKS3/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: plans
          path: ${{ runner.temp }}/plans
      - id: build
        env:
          EVAL_MANIFEST_VERSION: ${{ needs.eval.outputs.manifest-version }}
        run: |
          mapfile -t shared < "$RUNNER_TEMP/plans/shared.drvs"
          "$HESTIA_BIN" prefetch "${shared[@]/%/^*}"
          # upload what is built so far every 5 minutes: a runner that gets
          # killed mid-build never reaches the drain below, and the next
          # attempt substitutes these instead of building them again
          while sleep 300; do "$HESTIA_BIN" drain --socket "$HESTIA_SOCKET" || true; done &
          uploader=$!
          # a failed one fails the jobs of the machines that need it
          .github/ci-build.sh "${shared[@]/%/^*}" ||
            echo "::warning::some shared derivations failed to build"
          kill "$uploader"
          # upload now instead of in the post step, so the machine jobs can
          # wait for the manifest version that contains the shared outputs
          "$HESTIA_BIN" drain --socket "$HESTIA_SOCKET" 2>&1 | tee "$RUNNER_TEMP/drain.txt"
          drained=$(sed -nE 's/.*; manifest m[0-9]+#([0-9]+)$/\1/p' "$RUNNER_TEMP/drain.txt")
          echo "manifest-version=${drained:-$EVAL_MANIFEST_VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: [eval, shared]
    # also when the shared job was skipped: nothing to share
    if: >-
      !cancelled() && needs.eval.result == 'success' && needs.eval.outputs.any-jobs == 'true'
      && (needs.shared.result == 'success' || needs.shared.result == 'skipped')
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read # hestia: detect evicted cache entries upfront
      id-token: write # niks3 push
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.eval.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            trusted-users = root runner
            extra-substituters = https://cache.lassul.us
            extra-trusted-public-keys = cache.lassul.us-1:aOMEO5TU6eLvhyPi0jmgjR2sVlGjMq3rK0MeACjTcQ0=
      - uses: Mic92/hestia@v3
        with:
          upstream-cache-filter: true
          upstream-cache-key-names: cache.nixos.org-1 cache.lassul.us-1
          wait-manifest-version: ${{ needs.shared.outputs.manifest-version || needs.eval.outputs.manifest-version }}
      - env:
          NIKS3: ${{ needs.eval.outputs.niks3 }}
        run: |
          nix-store --realise "$NIKS3"
          echo "$NIKS3/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: plans
          path: ${{ runner.temp }}/plans
      - name: build ${{ matrix.name }}
        env:
          NAME: ${{ matrix.name }}
          INSTALLABLES: ${{ matrix.installables }}
          LAZY_STORE: ${{ needs.eval.outputs.lazy-store }}
        run: |
          read -ra installables <<<"$INSTALLABLES"
          # the closure needs only the caches, so it runs while the drvs are
          # fetched
          .github/lazy-store.sh closure "$RUNNER_TEMP/plans/$NAME.fetch" &
          closure=$!
          "$HESTIA_BIN" prefetch "${installables[@]}"
          wait "$closure"
          .github/lazy-store.sh mount
          .github/ci-build.sh "${installables[@]}"
      - name: lazy store log
        if: always()
        run: |
          dir=$RUNNER_TEMP/lazy-store
          if [ -s "$dir/stats.json" ]; then
            jq -r '"\(.nar_count // 0) NARs fetched, \((.nar_bytes // 0) / 1048576 | floor) MiB"' "$dir/stats.json"
          fi
          cat "$dir/fuse.log" 2>/dev/null || true

  # The phone massulus (droid-nix, machines/massulus/droid-nix.nix), built
  # natively on an arm runner and pushed to cache.lassul.us for the phone to
  # substitute. Its own niks3, the eval job's is x86_64. hestia keeps what a
  # PR run built, so master's run after the merge substitutes it.
  massulus:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: read # hestia: detect evicted cache entries upfront
      id-token: write # niks3 push
    steps:
      - uses: actions/checkout@v4
      - if: inputs.url
        env:
          URL: ${{ inputs.url }}
          SHA: ${{ inputs.sha }}
        run: .github/fetch-pr.sh
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            trusted-users = root runner
            extra-substituters = https://cache.lassul.us
            extra-trusted-public-keys = cache.lassul.us-1:aOMEO5TU6eLvhyPi0jmgjR2sVlGjMq3rK0MeACjTcQ0=
      - uses: Mic92/hestia@v3
        with:
          upstream-cache-filter: true
          upstream-cache-key-names: cache.nixos.org-1 cache.lassul.us-1
      - run: |
          niks3=$(nix build --no-link --print-out-paths .#niks3)
          echo "$niks3/bin" >> "$GITHUB_PATH"
          PATH=$niks3/bin:$PATH .github/niks3-push.sh "$niks3"
      - run: .github/ci-build.sh "$FLAKE#droidNixConfigurations.massulus.activationPackage"

  # The Mac barnacle (nix-darwin), built on a macOS runner and pushed to
  # cache.lassul.us for `s deploy` to substitute. Its system includes the
  # aarch64-linux VM image of nix-rosetta-builder, which macOS can't build:
  # barnacle-linux builds the Linux derivations that darwin ones depend on
  # directly and hands them to barnacle through hestia (drained before the
  # job ends, like the shared job). Both skip the build when nothing would be
  # built (`nix build --dry-run`), instead of downloading the whole closure.
  barnacle-linux:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: read # hestia: detect evicted cache entries upfront
      id-token: write # niks3 push
    outputs:
      manifest-version: ${{ steps.build.outputs.manifest-version }}
    steps:
      - uses: actions/checkout@v4
      - if: inputs.url
        env:
          URL: ${{ inputs.url }}
          SHA: ${{ inputs.sha }}
        run: .github/fetch-pr.sh
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            trusted-users = root runner
            extra-substituters = https://cache.lassul.us
            extra-trusted-public-keys = cache.lassul.us-1:aOMEO5TU6eLvhyPi0jmgjR2sVlGjMq3rK0MeACjTcQ0=
            # the VM image needs kvm, which arm runners lack; vmTools'
            # qemu runs with accel=kvm:tcg, so it builds emulated instead
            extra-system-features = kvm
      - uses: Mic92/hestia@v3
        with:
          upstream-cache-filter: true
          upstream-cache-key-names: cache.nixos.org-1 cache.lassul.us-1
      - run: |
          niks3=$(nix build --no-link --print-out-paths .#niks3)
          echo "$niks3/bin" >> "$GITHUB_PATH"
          PATH=$niks3/bin:$PATH .github/niks3-push.sh "$niks3"
      - id: build
        run: |
          drv=$(nix eval --raw "$FLAKE#darwinConfigurations.barnacle.system.drvPath")
          # derivation show: {derivations: {...}} with inputs.drvs since Nix
          # 2.32, a plain object with inputDrvs before
          mapfile -t linux < <(nix derivation show -r "$drv" | jq -r '
            (.derivations // .) | with_entries(.key |= ltrimstr("/nix/store/")) as $d
            | [$d[] | select(.system != "aarch64-linux")
               | (.inputs.drvs // .inputDrvs) | keys[] | ltrimstr("/nix/store/")
               | select($d[.].system == "aarch64-linux")]
            | unique[] | "/nix/store/\(.)^*"')
          printf 'Linux derivations of barnacle: %s\n' "${linux[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ ${#linux[@]} -eq 0 ] ||
            ! nix build --dry-run "${linux[@]}" 2>&1 | grep -q 'will be built'; then
            echo "nothing to build"
            exit 0
          fi
          .github/ci-build.sh "${linux[@]}"
          # upload now instead of in the post step, so barnacle can wait for
          # the manifest version that contains them
          "$HESTIA_BIN" drain --socket "$HESTIA_SOCKET" 2>&1 | tee "$RUNNER_TEMP/drain.txt"
          drained=$(sed -nE 's/.*; manifest m[0-9]+#([0-9]+)$/\1/p' "$RUNNER_TEMP/drain.txt")
          echo "manifest-version=$drained" >> "$GITHUB_OUTPUT"

  barnacle:
    needs: barnacle-linux
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read # hestia: detect evicted cache entries upfront
      id-token: write # niks3 push
    steps:
      - uses: actions/checkout@v4
      - if: inputs.url
        env:
          URL: ${{ inputs.url }}
          SHA: ${{ inputs.sha }}
        run: .github/fetch-pr.sh
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            trusted-users = root runner
            extra-substituters = https://cache.lassul.us
            extra-trusted-public-keys = cache.lassul.us-1:aOMEO5TU6eLvhyPi0jmgjR2sVlGjMq3rK0MeACjTcQ0=
      - uses: Mic92/hestia@v3
        with:
          upstream-cache-filter: true
          upstream-cache-key-names: cache.nixos.org-1 cache.lassul.us-1
          wait-manifest-version: ${{ needs.barnacle-linux.outputs.manifest-version }}
      - id: dry-run
        run: |
          if nix build --dry-run "$FLAKE#darwinConfigurations.barnacle.system" 2>&1 | grep -q 'will be built'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing to build"
          fi
      # the closure is about 10 GiB; deleting the runner image's Xcode
      # bundles other than the selected one and its Android SDK makes room
      - if: steps.dry-run.outputs.build
        run: |
          df -h /System/Volumes/Data
          keep=$(xcode-select -p | sed 's|/Contents/Developer$||')
          for app in /Applications/Xcode*.app; do
            [ "$app" = "$keep" ] || [ -L "$app" ] || sudo rm -rf "$app"
          done
          sudo rm -rf "${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          df -h /System/Volumes/Data
      - if: steps.dry-run.outputs.build
        run: |
          niks3=$(nix build --no-link --print-out-paths .#niks3)
          echo "$niks3/bin" >> "$GITHUB_PATH"
          PATH=$niks3/bin:$PATH .github/niks3-push.sh "$niks3"
      - id: build
        if: steps.dry-run.outputs.build
        run: .github/ci-build.sh "$FLAKE#darwinConfigurations.barnacle.system"
      # hestia drops the download of barnacle's VM disk image without a log
      # line; find out why
      - if: failure() && steps.build.outcome == 'failure'
        run: .github/hestia-nar-debug.sh

  # Summary of the jobs above; for a tangled.org PR it also comments the
  # result there (as hermes.pds.lassul.us). Skipped jobs: no machine to
  # build, or a job they need failed.
  ci:
    needs:
      [
        list,
        check,
        outputs,
        eval,
        shared,
        build,
        massulus,
        barnacle-linux,
        barnacle,
      ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the run's job results
    steps:
      - if: inputs.pr
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: inputs.pr
        env:
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          ANY_JOBS: ${{ needs.eval.outputs.any-jobs }}
          GH_TOKEN: ${{ github.token }}
          TANGLED_APP_PASSWORD: ${{ secrets.TANGLED_APP_PASSWORD }}
        run: .github/tangled-pr-report.sh
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || [ "$r" = skipped ] || exit 1
          done
