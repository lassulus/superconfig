name: exp lazy fuse store

# Experiment, see .github/exp/lazy-fuse.sh. All logic lives there so that
# changing it doesn't need a push touching .github/workflows/.

on:
  push:
    branches: [ci-lazy-fuse]

permissions:
  contents: read

jobs:
  lazy:
    runs-on: ubuntu-latest
    env:
      MACHINE: neoprism
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            trusted-users = root runner
            extra-substituters = https://cache.lassul.us
            extra-trusted-public-keys = cache.lassul.us-1:aOMEO5TU6eLvhyPi0jmgjR2sVlGjMq3rK0MeACjTcQ0=
            extra-experimental-features = nix-command flakes local-overlay-store read-only-local-store
      - run: bash .github/exp/lazy-fuse.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp-lazy-fuse
          path: ${{ runner.temp }}/lazy-out/
